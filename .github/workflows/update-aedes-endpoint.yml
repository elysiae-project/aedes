name: Update Aedes Endpoint Data

on:
    push:
        branches:
            - main
    schedule:
        - cron: "15 8/4 * * *"
    
permissions:
    contents: write

jobs:
    update-endpoint:
        runs-on: ubuntu-latest
        steps: 
            - uses: actions/checkout@v6
            - name: Set up Node.JS
              uses: actions/setup-node@v6
              with:
                node-version: 26
            - name: Install Deps
              run: |
                sudo add-apt-repository universe
                sudo apt update
                sudo apt install ffmpeg
            - name: Install Project Deps
              run: |
                npm i -g corepack
                corepack enable
                yarn
            - name: Generate Assets and deploy
              run: |
                npm run generate
            - name: Deploy
              uses: cloudflare/wrangler-action@v4
              with:
                apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}