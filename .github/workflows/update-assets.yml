name: Update Aedes assets endpoint
on:
    workflow_dispatch:
    push:
        paths:
            - "src/*"
            - ".github/workflows/update-assets.yml"
    schedule:
        - cron: "15 8/4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
    update-and-deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Set Up NodeJS
              uses: actions/setup-node@v6
              with:
                node-version: 26

            - name: Install FFMpeg
              run: |
                sudo add-apt-repository universe
                sudo apt update
                sudo apt install ffmpeg
            
            - name: Install Npm Dependencies
              run: |
                npm i -g corepack@latest
                corepack enable
                yarn
            
            - name: Run aedes component/asset updater
              run: yarn generate

            - name: Push updated component file to repo
              run: |
                git config --global user.name 'github-actions[bot]'
                git config --global user.email 'github-actions[bot]@users.noreply.github.com'
                git add -A
                if git diff --cached --quiet; then
                  echo "No changes to commit"
                  echo "changes_pushed=false" >> $GITHUB_OUTPUT
                else
                  git commit -m "chore: Update Elysiae assets registry"
                  git push origin HEAD:main
                  echo "changes_pushed=true" >> $GITHUB_OUTPUT
                fi
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Prepare for Deploy
              run: |
                mkdir -pv endpoint
                cp assets endpoint/assets
                cp components endpoint/components

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                path: ./endpoint

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
